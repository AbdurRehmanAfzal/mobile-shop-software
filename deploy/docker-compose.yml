# Production stack for one VPS (Hostinger KVM). Run from the repo root:
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d --build
name: mobileshop

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mobileshop}
      POSTGRES_USER: ${POSTGRES_USER:-mobileshop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mobileshop} -d ${POSTGRES_DB:-mobileshop}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: prod
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mobileshop}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-mobileshop}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in deploy/.env}
      CORS_ORIGINS: '["https://${APP_DOMAIN}", "https://localhost", "capacitor://localhost"]'
      UPLOAD_DIR: /data/uploads
      WEB_WORKERS: ${WEB_WORKERS:-2}
      PUBLIC_SIGNUP: ${PUBLIC_SIGNUP:-false}
      SUPERUSER_PHONES: ${SUPERUSER_PHONES:-}
    volumes:
      - uploads:/data/uploads

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN in deploy/.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in deploy/.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
