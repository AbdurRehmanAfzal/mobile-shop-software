# Release: every push to main (develop is merged into main when a version is ready), or by hand.
#   1. all CI checks (ci.yml)
#   2. build the backend and web images, push them to GitHub's registry (ghcr.io), tagged with the commit
#   3. SSH to the VPS as 'deploy' and run /opt/mobileshop/deploy.sh <tag> (pull, restart, health check, rollback)
# Secrets (repo → Settings → Secrets and variables → Actions), the same as the oop-solutions website:
#   VPS_HOST     72.62.240.10
#   VPS_USER     deploy
#   VPS_SSH_KEY  private key whose public half is in /home/deploy/.ssh/authorized_keys
# Variable (optional): APP_URL, e.g. https://mobileshop.oopsolutions.com, for the final check.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  images:
    needs: checks
    runs-on: ubuntu-latest
    env:
      PREFIX: ghcr.io/abdurrehmanafzal/mobile-shop
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.PREFIX }}-backend:${{ github.sha }},${{ env.PREFIX }}-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: ${{ env.PREFIX }}-web:${{ github.sha }},${{ env.PREFIX }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::VPS_SSH_KEY is not a valid private key"; exit 1; }
      - name: Deploy on the VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "sudo -n /opt/mobileshop/deploy.sh ${{ github.sha }}"
      - name: Check the live site
        if: vars.APP_URL != ''
        # the first deploy on a new domain waits for Traefik to fetch the certificate: retry for 2 minutes
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "${{ vars.APP_URL }}/health" || true)
            echo "try $i: ${{ vars.APP_URL }}/health -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
