# Android app (Capacitor): built by every release (deploy.yml calls this workflow; the APK is then
# served by the site at /app.apk, owner 2026-10-28) or by hand (Actions → Android → Run workflow).
# The APK is also kept as a build artifact of the run.
# The app carries the React build and talks to the live API (vars.APP_URL).
# Secrets (see docs/13): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS.
# Without them a debug-signed APK is built for testing only (a later release-signed one cannot update it).
name: Android

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # minutes since 1970: always higher than the last build, whichever workflow made it
      - name: Version
        run: |
          echo "APP_VERSION_CODE=$(( $(date -u +%s) / 60 ))" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - run: npm ci --no-audit --no-fund
      - name: Web build for the app + copy into the Android project
        env:
          VITE_API_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$VITE_API_URL" || { echo "::error::set the repository variable APP_URL"; exit 1; }
          npm run build:native
      - name: Signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "file=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: building a debug-signed APK for testing only"
          fi
      - name: Build APK
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.key.outputs.file }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/mobile-shop-${APP_VERSION_NAME}.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/mobile-shop-${APP_VERSION_NAME}-test.apk"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-shop-android-${{ env.APP_VERSION_NAME }}
          path: ${{ runner.temp }}/mobile-shop-*.apk
          retention-days: 90
