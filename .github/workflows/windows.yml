# The one-PC Windows program (owner 2026-10-30): MobileShop-Setup-<version>.exe as a build artifact.
# Runs by hand (Actions → Windows → Run workflow) or on a release when local/, backend/ or
# frontend/ changed. Download the artifact zip from the run page; inside is the Setup .exe.
name: Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the installer (e.g. 2.1.0)"
        default: "2.0.0"
  push:
    branches: [main]
    paths: ["local/**", "backend/**", "frontend/**", ".github/workflows/windows.yml"]

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Web app (same origin)
        working-directory: frontend
        env:
          VITE_API_URL: ""
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: Python bundle
        run: |
          pip install -e "backend[local]"
          pyinstaller --noconfirm --clean local/mobileshop.spec
      - name: Smoke test the bundle
        shell: pwsh
        run: |
          $env:MOBILESHOP_DATA = "$env:RUNNER_TEMP\msdata"
          $env:MOBILESHOP_PORT = "8790"
          $p = Start-Process -FilePath dist\MobileShop\MobileShop.exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8790/health; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch {}
            Start-Sleep -Seconds 1
          }
          $page = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8790/
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "bundle did not answer /health" }
          if ($page.Content -notmatch "<div id=""root""") { throw "bundle did not serve the web app" }
      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $v = "${{ github.event.inputs.version }}"; if (-not $v) { $v = "2.0.0" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" local\installer.iss
          Move-Item dist\MobileShop-Setup-*.exe . -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: MobileShop-Setup
          path: MobileShop-Setup-*.exe
          if-no-files-found: error
