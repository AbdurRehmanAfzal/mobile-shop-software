# Staging (ADR-132): every push to the `staging` branch, or by hand.
#   1. all CI checks (ci.yml)
#   2. build the backend and web images, tagged with the commit and `staging` — NEVER `latest`,
#      which is what the shops' server falls back to
#   3. SSH to the VPS and run /opt/mobileshop-staging/deploy.sh <tag>: the staging stack only,
#      with its own database, at STAGING_URL. The shops' stack (/opt/mobileshop) is not touched.
# Uses the same repository secrets as deploy.yml (VPS_HOST, VPS_USER, VPS_SSH_KEY).
# One-time on the server: deploy/staging/setup-vps.sh.
name: Staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  STAGING_URL: https://staging-mobileshop.oopsolutions.com

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  images:
    needs: checks
    runs-on: ubuntu-latest
    env:
      PREFIX: ghcr.io/abdurrehmanafzal/mobile-shop
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.PREFIX }}-backend:${{ github.sha }},${{ env.PREFIX }}-backend:staging
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend-staging
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/web.Dockerfile
          push: true
          tags: ${{ env.PREFIX }}-web:${{ github.sha }},${{ env.PREFIX }}-web:staging
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web-staging

  deploy:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null || { echo "::error::VPS_SSH_KEY is not a valid private key"; exit 1; }
      - name: Deploy the staging stack on the VPS
        run: |
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" "sudo -n /opt/mobileshop-staging/deploy.sh ${{ github.sha }}"
      - name: Check the staging site
        # the first deploy waits for Traefik to fetch the certificate: retry for 2 minutes
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$STAGING_URL/health" || true)
            echo "try $i: $STAGING_URL/health -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          exit 1
